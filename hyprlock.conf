# ── MEDICINE • HYPRLOCK • CYBERPUNK ──
$font   = JetBrainsMono Nerd Font
$pink   = rgba(ff0055ff)
$cyan   = rgba(00ffc8ff)
$yellow = rgba(fffc58ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 6, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.02
    contrast = 1.1
    brightness = 0.55
    vibrancy = 0.3
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $pink
    font_size = 140
    font_family = $font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(ff005599)
    position = 0, 220
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B" | tr '[:lower:]' '[:upper:]'
    color = $cyan
    font_size = 20
    font_family = $font Bold
    shadow_passes = 2
    shadow_color = rgba(00ffc877)
    position = 0, 90
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = cmd[update:0] echo "󰣇  $USER@$(uname -n)"
    color = rgba(e6e1ffcc)
    font_size = 13
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 3
    rounding = 12
    inner_color = rgba(120b10cc)
    outer_color = $pink $cyan 45deg
    check_color = $cyan $yellow 120deg
    fail_color = rgba(ff3355ff) rgba(ff0000ff) 40deg
    font_color = $cyan
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##ff005599">  ACCESS CODE</span>
    fail_text = <span foreground="##ff3355">✖ $FAIL ($ATTEMPTS)</span>
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    shadow_passes = 2
    shadow_color = rgba(ff005566)
    position = 0, -40
    halign = center
    valign = center
}

# Estado
label {
    monitor =
    text = // SYSTEM LOCKED //
    color = rgba(ff005599)
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}

# ── v2: HUD ──
# Canción actual
label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata --format '{{ artist }} — {{ title }}' 2>/dev/null | cut -c1-60); [ -n "$t" ] && echo "󰝚  $t"
    color = $yellow
    font_size = 13
    font_family = $font Bold
    position = 0, -200
    halign = center
    valign = center
}

# Esquina superior izquierda
label {
    monitor =
    text = cmd[update:60000] echo "<b>// NODE</b>  $(uname -n)<br/><b>// KERN</b>  $(uname -r | cut -d- -f1)<br/><b>// UP</b>    $(uptime -p | sed 's/up //')"
    color = rgba(00ffc8aa)
    font_size = 11
    font_family = $font
    position = 40, -40
    halign = left
    valign = top
}

# Esquina superior derecha
label {
    monitor =
    text = cmd[update:5000] echo "<b>CPU</b> $(awk -v n=$(nproc) '{print int($1*100/n)"%"}' /proc/loadavg)  <b>MEM</b> $(free | awk '/Mem/{printf "%d%%", $3*100/$2}')"
    color = rgba(ff0055aa)
    font_size = 11
    font_family = $font
    position = -40, -40
    halign = right
    valign = top
}

# Esquina inferior derecha
label {
    monitor =
    text = 󰒃  AUTH REQUIRED_
    color = rgba(fffc5899)
    font_size = 11
    font_family = $font Bold
    position = -40, 40
    halign = right
    valign = bottom
}
